name: Build Wave installers

# Push to GitHub, open the "Actions" tab, run "Build Wave installers" (or push a tag like v1.0.0).
# When it finishes, download the installers from the "Artifacts" section of the run.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: macos-latest
            script: dist:mac
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux build tools for the key-press module
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxtst-dev libpng-dev libx11-dev libxkbfile-dev
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:motion
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # unsigned build; see README for signing
      - uses: actions/upload-artifact@v4
        with:
          name: wave-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
